name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://rdrufdlhfrwczqvmvzgr.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkcnVmZGxoZnJ3Y3pxdm12emdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2ODY5OTgsImV4cCI6MjA4ODI2Mjk5OH0.k8EiIOB2HiHxjuPITlIYf5xWGCNWV7EA5Tfe3br7yew
          VITE_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VITE_DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          VITE_DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          VITE_FAL_API_KEY: ${{ secrets.FAL_API_KEY }}

      - name: Verify build
        run: |
          echo "Checking for direct API call in build..."
          grep -c "api.anthropic.com" dist/assets/*.js || echo "WARNING: API endpoint not found in build"
          echo "Checking VITE_ANTHROPIC_API_KEY was set..."
          grep -c "VITE_ANTHROPIC_API_KEY not set" dist/assets/*.js && echo "WARNING: API key was NOT injected" || echo "OK: API key was injected"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
